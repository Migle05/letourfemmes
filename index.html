<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Femmes - Classificação</title>
    <style>
        /* Aqui vem o css */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
            background: #f7f8f1;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 90px;
            background: #26311a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            transition: height 0.4s;
            z-index: 10;
        }
    </style>
</head>
<body>
    <nav id="navBar">
        <div class="logo">Le Tour Femmes</div>
        <div>
            <a href="#classificacao">Classificação</a>
            <a href="#graficos">Gráficos</a>
            <a href="#sobre">Sobre</a>
        </div>
    </nav>

    <header class="hero">
        <div>
            <h1>General Classification</h1>
            <p>Classificação após a etapa 6</p>
            <a href="#classificacao">Ver Classificacão</a>
        </div>
    </header>

    <main>
        <section id="classficacao">
            <h2>Classificacão Geral</h2>
            <p>Clica num ciclista para ver os seus detalhes</p>
            <div class="tabela-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Posição</th>
                            <th>Nome</th>
                            <th>Equipa</th>
                            <th>Tempo</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </section>
    </main>
    <div id="modal" class="modal">
        <div class="modal-card">
            <button id="fechar">x</button>
        </div>
    </div>




    <script>
        // Aqui vem o javaScript
        const navBar = document.getElementById('navBar');

        window.addEventListener('scroll', () => {
            if(window.scroll >50)
                console.log("Fora do topo")
            else
                console.log("No topo")
        });
    </script>
</body>
</html>
